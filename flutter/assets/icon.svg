<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Goal Remote — ícone original (acesso remoto + conexão). Marca Goal: azul. Verde = "conectado/saudável". -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="screen" x1="120" y1="150" x2="392" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8F0FE"/>
    </linearGradient>
  </defs>

  <!-- fundo app-icon arredondado -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- tela remota (de trás), levemente deslocada -->
  <rect x="196" y="168" width="208" height="150" rx="20" fill="#60A5FA" opacity="0.45"/>

  <!-- tela principal (de frente) -->
  <rect x="108" y="150" width="236" height="168" rx="22" fill="url(#screen)"/>
  <!-- base/pé do monitor -->
  <rect x="206" y="318" width="40" height="34" fill="#DCE7FB"/>
  <rect x="166" y="350" width="120" height="18" rx="9" fill="#DCE7FB"/>

  <!-- símbolo de conexão dentro da tela: dois nós ligados por um "túnel" -->
  <line x1="162" y1="234" x2="290" y2="234" stroke="#3B82F6" stroke-width="16" stroke-linecap="round"/>
  <circle cx="162" cy="234" r="24" fill="#1E3A8A"/>
  <circle cx="290" cy="234" r="24" fill="#3B82F6"/>

  <!-- ponto "online/saudável" verde no canto da conexão remota -->
  <circle cx="372" cy="186" r="30" fill="#10B981" stroke="#FFFFFF" stroke-width="8"/>
</svg>
